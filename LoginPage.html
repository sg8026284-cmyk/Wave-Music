<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In – Him</title>
    <link rel="stylesheet" href="LoginPage.css">
</head>
<body>

    <div class="login-container">
        <h2>Welcome Back</h2>
        
        <form action="LoginServlet" method="POST">
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <!-- name="user_email" matches request.getParameter("user_email") -->
                <input type="email" id="email" name="user_email" placeholder="Enter Your Email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <!-- name="pwd_1" matches request.getParameter("pwd_1") -->
                <input type="password" id="password" name="pwd_1" placeholder="Enter your password" required>
            </div>

            <div class="form-options">
                <label>
                    <input type="checkbox" name="remember"> Remember me
                </label>
                <a href="forgot-password.html">Forgot Password?</a>
            </div>

            <!-- type MUST be "submit" -->
            <button type="submit" class="submit-btn">Log In</button>
        5    
        </form>

        <div class="register-link">
            Don't have an account? <a href="RegisterPage.html">Sign up here</a>
        </div>
    </div>
</body>
</html>
