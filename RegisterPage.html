<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create an Account</title>
    <link rel="stylesheet" href="RegisterPage.css">
    </head>
<body>

    <div class="registration-container">
        <h2>Create an Account</h2>
        <form action="RegisterServlet" method="POST">
            
            <div class="form-group">
                <label for="fname">First Name</label>
                <input type="text" id="fname" name="f_name" placeholder="Enter First Name" required>
                <label for="lname">Last Name</label>
                <input type="text" id="lname" name="l_name" placeholder="Enter Last Name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="user_email" placeholder="Enter E-mail" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="pwd_1" placeholder="Create a strong password" required minlength="8">
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="pwd_2" placeholder="Confirm your password" required minlength="8">
            </div>

            <button type="submit" class="submit-btn">Register</button>
            
        </form>

        <div class="login-link">
            Already have an account? <a href="LoginPage.html">Log in here</a>
        </div>
    </div>

</body>
</html>
